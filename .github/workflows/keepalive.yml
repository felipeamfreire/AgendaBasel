# Mantém o projeto Supabase (plano gratuito) ativo: faz uma leitura pública por dia.
# Usa apenas a chave pública (a mesma do config.js); não acessa dados privados.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 9 * * *'   # todo dia, 09:17 UTC
  workflow_dispatch: {}     # permite rodar manualmente (aba Actions > Run workflow)
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Leitura pública no Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://bzgmbpypzkqfpwzgrvyt.supabase.co/rest/v1/parceiros_publico?select=id&limit=1" \
            -H "apikey: sb_publishable_fvJ_I7XyrXJ2AntO5ZRhwA_-D6p0AnX")
          echo "HTTP $code"
          test "$code" = "200"

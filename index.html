<title>Agenda de Food Trucks do Basel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--red:#C8191E;--ink:#1A1A1A;--bg:#fafafa;--card:#fff;--line:#e5e5e5;--ev:#FBE3D6;--mut:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f2f2f2;--bg:#141414;--card:#202020;--line:#333;--ev:#4a2a20;--mut:#aaa}}
:root[data-theme="dark"]{--ink:#f2f2f2;--bg:#141414;--card:#202020;--line:#333;--ev:#4a2a20;--mut:#aaa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}
header img{height:46px;background:#fff;border-radius:8px;padding:2px}
header h1{font-size:1.05rem;margin:0;line-height:1.2}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font-size:.9rem;cursor:pointer;white-space:nowrap}
nav .adm-btn{margin-left:auto}
nav button.on,.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:1000px;margin:0 auto;padding:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:.9rem}
.bar input{flex:1;min-width:140px}
h2{font-size:1.15rem;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.wa{font-size:.85rem;color:#128C7E;text-decoration:none;font-weight:600}.wa:hover{text-decoration:underline}
.card .i{flex:1;min-width:0}.card b{display:block}.card small{color:var(--mut)}
.tag{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-top:4px;background:#e6e6e6;color:#333}
.tag.fx{background:#d6f0e0;color:#14532d}
.ev{background:var(--ev);border-radius:12px;padding:12px;margin-bottom:10px}
.day{margin-bottom:14px}.day h3{margin:0 0 6px;font-size:.95rem;color:var(--red)}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.col{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:.78rem;min-height:90px}
.col h4{margin:0 0 4px;font-size:.8rem;color:var(--red)}.col div{padding:2px 0;border-top:1px solid var(--line)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.75rem;color:var(--mut)}
.cal .c{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:58px;padding:4px;font-size:.72rem;cursor:pointer}
.cal .c.ev{background:var(--ev)}.cal .c.t{outline:2px solid var(--red)}.cal .n{background:var(--red);color:#fff;border-radius:8px;padding:0 5px;font-size:.68rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.modal.on{display:flex}.mb{background:var(--card);border-radius:14px;padding:14px;max-width:420px;width:100%;text-align:center}
#fs{position:fixed;inset:0;background:#000;z-index:20;display:none;align-items:center;justify-content:center}#fs.on{display:flex}
#fs img{max-width:100%;max-height:100%;object-fit:contain}
#fsx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:21;background:#C8191E;color:#fff;border:0;border-radius:20px;padding:10px 16px;font-size:1rem;cursor:pointer}
.slide img{cursor:zoom-in}
.slide{height:300px;border-radius:10px;background:var(--ev);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:10px 0;font-weight:600}
.adm{border:2px dashed var(--red);border-radius:10px;padding:10px;margin-bottom:12px;font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}.row span{flex:1;min-width:150px}
#banner{position:fixed;left:-9999px;top:0;width:540px;background:#fff;color:#1A1A1A;padding:24px;font-family:system-ui,sans-serif}
@media(max-width:700px){.grid7{display:none}}
@media(min-width:701px){.wk{display:none}}
</style>

<nav id="nav"></nav>
<main id="app"></main>
<div class="modal" id="modal"><div class="mb" id="mb"></div></div>
<div id="fs"><button id="fsx" onclick="fsClose()">✕ Fechar</button><img id="fsi" alt="Cardápio"></div>
<div id="banner"></div>
<script>
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const CATS=['Salgado','Doce','Bebida','Outros'],EM={Salgado:'🍗',Doce:'🍪',Bebida:'🥤',Outros:'🫙'};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let P=[],EV=[],AG=[],REC=[],CARD={};
async function load(){
 const [a,b,c,d,r]=await Promise.all([sb.from(S.admin?'parceiros':'parceiros_publico').select('*'),sb.from('agenda_gerada').select('*'),sb.from('eventos_especiais').select('*').order('data'),sb.from('cardapios_parceiro').select('*').order('ordem'),sb.from('recorrencias_parceiro').select('*')]);
 if(a.error)console.error(a.error);
 REC=r.data||[];AG=b.data||[];
 P=(a.data||[]).map(p=>({id:p.id,n:p.nome_operacao,c:p.categoria,k:p.culinaria,r:p.nome_responsavel,t:p.contato_responsavel||'',logo:p.logo_url,fx:REC.some(x=>x.parceiro_id===p.id&&x.recorrente)}))
  .sort((x,y)=>CATS.indexOf(x.c)-CATS.indexOf(y.c)||x.n.localeCompare(y.n,'pt-BR',{sensitivity:'base'}));
 EV=(c.data||[]).map(e=>({...e,t:e.titulo,d:e.data,h:e.horario,tr:e.trucks_participantes||[]}));
 CARD={};(d.data||[]).forEach(x=>(CARD[x.parceiro_id]=CARD[x.parceiro_id]||[]).push(x))}

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T12:00:00'),br=d=>d.toLocaleDateString('pt-BR');
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const evOn=d=>EV.filter(e=>e.d===iso(d));
const VIS=['Ativo','Confirmado','Pendente Confirmação'];
function day(d,inc){const k=iso(d),ev=evOn(d),out=[];
 P.forEach(p=>{const g=AG.find(x=>x.parceiro_id===p.id&&x.data===k);
  if(g&&(inc||VIS.includes(g.status)))out.push({...p,ag:g});
  else if(!g&&ev.some(e=>e.tr.includes(p.id)))out.push({...p})});
 return out}
let view='hoje',cur=new Date(),f={cat:'',cul:'',q:''},admin=false;
const tag=p=>p.fx?'<span class="tag fx">Parceiro Fixo</span>':'<span class="tag">Parceiro Extra</span>';
function filt(l){return l.filter(p=>(!f.cat||p.c===f.cat)&&(!f.cul||p.k===f.cul)&&(!f.q||p.n.toLowerCase().includes(f.q.toLowerCase())))}
const telWa=t=>{t=String(t||'').replace(/\D/g,'');return t&&t.length<=11?'55'+t:t};
const telFmt=t=>{t=String(t||'').replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');return t.length===11?`(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}`:t.length===10?`(${t.slice(0,2)}) ${t.slice(2,6)}-${t.slice(6)}`:t};
function card(p){return `<div class="card">${p.logo?`<img class="av" src="${p.logo}" alt="" style="object-fit:cover">`:`<div class="av">${p.n[0]}</div>`}<div class="i"><b>${p.n}</b><small>${EM[p.c]} ${p.c} · ${p.k}</small><br>${tag(p)}${p.t?`<br><a class="wa" href="https://wa.me/${telWa(p.t)}" target="_blank" rel="noopener">💬 ${telFmt(p.t)}</a>`:''}</div><button class="btn" onclick="menu(${p.id})">Cardápio</button></div>`}
function bar(){const cu=[...new Set(P.map(p=>p.k))];
 return `<div class="bar"><input placeholder="Buscar food truck" value="${f.q}" oninput="f.q=this.value;render(1)"><select onchange="f.cat=this.value;render()"><option value="">Categoria</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="f.cul=this.value;render()"><option value="">Culinária</option>${cu.map(c=>`<option ${f.cul===c?'selected':''}>${c}</option>`).join('')}</select></div>`}
function render(keep){
 document.getElementById('nav').innerHTML=[['hoje','Dia'],['sem','Semana'],['mes','Mês'],['adm','🔒 Admin']].map(([k,l])=>`<button class="${view===k?'on':''}${k==='adm'?' adm-btn':''}" onclick="view='${k}';render()">${l}</button>`).join('');
 const a=document.getElementById('app');let h='';
 if(view==='hoje')h=vHoje();else if(view==='sem')h=vSem();else if(view==='mes')h=vMes();else h=vAdm();
 a.innerHTML=h;
 if(keep){const i=a.querySelector('input[placeholder^="Buscar"]');if(i){i.focus();i.setSelectionRange(99,99)}}}
function nav(n){cur=addD(cur,n);render()}
function goDate(v){if(v){cur=pd(v);render()}}
function goHoje(){cur=new Date();render()}
function vHoje(){const l=filt(day(cur));const ev=evOn(cur);
 return bar()+`<div class="bar"><button class="btn" onclick="nav(-1)">‹</button><h2 style="margin:0;flex:1;text-align:center">${DIAS[cur.getDay()]}, ${br(cur)}</h2><button class="btn" onclick="nav(1)">›</button></div><div class="bar"><label style="display:flex;align-items:center;gap:6px;flex:1">📅 <input type="date" id="dsel" value="${iso(cur)}" onchange="goDate(this.value)" style="flex:1"></label><button class="btn ${iso(cur)===iso(new Date())?'':'pri'}" ${iso(cur)===iso(new Date())?'disabled style="opacity:.5"':''} onclick="goHoje()">Hoje</button></div>`
 +ev.map(e=>`<div class="ev"><b>🎉 ${e.t}</b><br><small>${e.h}</small></div>`).join('')
 +(l.length?l.map(card).join(''):'<p>Nenhum food truck neste dia.</p>')
 +`<div class="bar"><button class="btn pri" onclick="shareTxt()">Compartilhar Agenda de Hoje</button></div>`}
function weekStart(d){return addD(d,-d.getDay())}
function vSem(){const s=weekStart(cur);const ds=[...Array(7)].map((_,i)=>addD(s,i));
 return bar()+`<div class="bar"><button class="btn" onclick="nav(-7)">‹</button><h2 style="margin:0;flex:1;text-align:center">Semana de ${br(ds[0])}</h2><button class="btn" onclick="nav(7)">›</button></div>`
 +`<div class="grid7">${ds.map(d=>`<div class="col"><h4>${DIAS[d.getDay()].slice(0,3)} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</h4>${filt(day(d)).map(p=>`<div>${p.n}<br><small>${p.k}</small></div>`).join('')}</div>`).join('')}</div>`
 +`<div class="wk">${ds.map(d=>{const l=filt(day(d));return `<div class="day"><h3>${DIAS[d.getDay()]} · ${br(d)}</h3>${l.length?l.map(card).join(''):'<small>Sem food trucks</small>'}</div>`}).join('')}</div>`}
function vMes(){const y=cur.getFullYear(),m=cur.getMonth(),first=new Date(y,m,1),n=new Date(y,m+1,0).getDate();let c='';
 for(let i=0;i<first.getDay();i++)c+='<div></div>';
 for(let i=1;i<=n;i++){const d=new Date(y,m,i,12),l=filt(day(d)),e=evOn(d).length;
  c+=`<div class="c ${e?'ev':''} ${iso(d)===iso(new Date())?'t':''}" onclick="cur=new Date(${y},${m},${i},12);view='hoje';render()">${i}${e?' 🎉':''}<br>${l.length?`<span class="n">${l.length}</span>`:''}</div>`}
 return bar()+`<div class="bar"><button class="btn" onclick="cur=new Date(${y},${m-1},1,12);render()">‹</button><h2 style="margin:0;flex:1;text-align:center">${cur.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="btn" onclick="cur=new Date(${y},${m+1},1,12);render()">›</button></div><div class="cal">${DIAS.map(d=>`<div class="h">${d.slice(0,3)}</div>`).join('')}${c}</div>`}
function vAdm(){return adminView()}
function menu(id){const p=P.find(x=>x.id===id),L=CARD[id]||[],mb=document.getElementById('mb');let i=0;
 const draw=()=>{const c=L[i];mb.innerHTML=`<b>${p.n} · Cardápio</b>`+(c?`<div class="slide">${/\.pdf$/i.test(c.cardapio_url)?`<a href="${c.cardapio_url}" target="_blank" rel="noopener">Abrir PDF</a>`:`<img src="${c.cardapio_url}" alt="Cardápio" onclick="fsOpen(this.src)" style="max-width:100%;max-height:100%;border-radius:8px">`}</div><small>${i+1} / ${L.length}</small><br>`:'<p>Cardápio ainda não cadastrado.</p>')+`<button class="btn" id="pv">‹</button> <button class="btn" id="nx">›</button> <button class="btn pri" id="cl">Fechar</button>`;
  mb.querySelector('#pv').onclick=()=>{if(L.length){i=(i-1+L.length)%L.length;draw()}};mb.querySelector('#nx').onclick=()=>{if(L.length){i=(i+1)%L.length;draw()}};mb.querySelector('#cl').onclick=()=>document.getElementById('modal').classList.remove('on')};
 draw();document.getElementById('modal').classList.add('on')}
function shareTxt(){const l=day(cur);let t=`🚚 *Hoje no Basel* 🗓️ ${br(cur)}\n`;
 CATS.forEach(c=>{const x=l.filter(p=>p.c===c);if(x.length)t+=`${EM[c]} *${c}:*\n`+x.map(p=>`• ${p.n} (${p.k})`).join('\n')+'\n'});
 t+=`📖 _Confira cardápios e a agenda completa em:_ ${location.href}`;

async function init(){
